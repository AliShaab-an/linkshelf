name: Verify

on:
  pull_request:
    branches: [main, v0.3]
  push:
    branches: [v0.3, 'fix/**', 'test/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run zip
      - run: npm run check:package
